name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  MC_SERVER_URL: https://piston-data.mojang.com/v1/objects/3872a7f07a1a595e651aef8b058dfc2bb3772f46/server.jar
  FABRIC_LOADER_URL: https://maven.fabricmc.net/net/fabricmc/fabric-loader/0.20.1/fabric-loader-0.20.1.jar
  FABRIC_API_URL: https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.145.1+26.1/fabric-api-0.145.1+26.1.jar

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify tag matches build version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $version = (Select-String -Path build.ps1 -Pattern '^\$Version = "(.+)"$').Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match build version $version"
          }

      - name: Download build dependencies
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 -o server.jar "$env:MC_SERVER_URL"
          curl.exe -L --fail --retry 3 -o fabric-loader.jar "$env:FABRIC_LOADER_URL"
          curl.exe -L --fail --retry 3 -o fabric-api.jar "$env:FABRIC_API_URL"

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -McJar server.jar -FabricLoaderJar fabric-loader.jar -FabricApiJar fabric-api.jar

      - name: Write checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter *.jar | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Set-Content -LiteralPath dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
