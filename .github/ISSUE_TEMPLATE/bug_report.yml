name: Bug report
description: Report a reproducible defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing:

        - Use Minecraft **26.3**, Java **25**, and either Fabric Loader **0.20.1** + Fabric API **0.166.2+26.3**, or NeoForge **26.3.0.115**.
        - Install the matching Foabic platform jar in `mods/`; Foabic mods go in `foabic-mods/`.
        - Do not mix Fabric and NeoForge in one instance.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the failure and paste the complete error or log excerpt.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: foabic
    attributes:
      label: Foabic version
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: loader
    attributes:
      label: Loader / API versions
      placeholder: Fabric 0.20.1 / API 0.166.2+26.3, or NeoForge 26.3.0.115
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Affected side
      options:
        - Dedicated server
        - Client
        - Both
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Where are the Foabic mods installed?
      options:
        - foabic-mods/
        - mods/
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Startup log (including FOABIC_ and Foabic lines) and the crash stack.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I use the official 26.3 server/client jars from the versions above.
          required: true
        - label: I did not modify the Foabic jars.
          required: true
