name: Bug report
description: Report a reproducible defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing:

        - Use Minecraft **26.1**, Fabric Loader **0.20.1** and Fabric API **0.145.1+26.1**.
        - Install `foabic-fabric-0.2.0.jar` in Fabric's `mods/`; logic-only mods may go in `foabic-mods/`.
        - Do not mix Foabic with NeoForge or a second mod loader.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the failure and paste the complete error or log excerpt.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: foabic
    attributes:
      label: Foabic version
      placeholder: 0.2.0
    validations:
      required: true

  - type: input
    id: fabric
    attributes:
      label: Fabric Loader / Fabric API
      placeholder: 0.20.1 / 0.145.1+26.1
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Affected side
      options:
        - Dedicated server
        - Client
        - Both
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Where are the Foabic mods installed?
      options:
        - Fabric mods/
        - foabic-mods/
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Startup log (including Foabic lines) and the crash stack.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I use the official 26.1 server/client jars from the versions above.
          required: true
        - label: I did not modify the Foabic jars.
          required: true
