name: Bug 报告
description: 报告可复现的缺陷
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。提交前请确认：

        - 使用**官方 26.1 `server.jar`**，并通过 `tools/run-server.ps1` / `run-server.sh` 启动；
          直接 `java -jar` 启动会得到已知的 `NoClassDefFoundError`。
        - 只安装了 Foabic 模组，没有和 Fabric / NeoForge 混用。

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么？贴出完整报错或关键日志。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 把模组放入 mods/
        2. 执行 run-server
        3. ...
    validations:
      required: true

  - type: input
    id: foabic
    attributes:
      label: Foabic 版本
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: mc
    attributes:
      label: Minecraft 版本
      placeholder: 26.1
    validations:
      required: true

  - type: input
    id: jdk
    attributes:
      label: JDK
      placeholder: OpenJDK 25.0.1 (Microsoft)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: launch
    attributes:
      label: 启动方式
      options:
        - tools/run-server.ps1
        - tools/run-server.sh
        - 自定义 flat classpath
        - java -jar（已知不可用）
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 启动日志（含 `Foabic` 行）与崩溃堆栈。
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，确认不是重复报告。
          required: true
        - label: 我使用的是官方 server.jar，且没有与 Fabric / NeoForge 混用。
          required: true
