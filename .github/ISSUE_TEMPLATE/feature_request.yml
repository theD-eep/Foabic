name: Feature request
description: Propose a capability or improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Foabic 1.0 is intentionally narrow. Read [docs/ROADMAP.md](../blob/main/docs/ROADMAP.md) first.

        Mixin, a Gradle/Maven build plugin and universal packaging are planned for **v1.1**, not v1.0.
        Networking, GUI, data generation and a full signal library are later.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not build today because of the missing capability?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: API shape, event, manifest field, or expected behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How do you work around it now, and why is that not enough?

  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: This does not require a third-party runtime dependency beyond the JDK and the platform loader/API.
          required: true
        - label: This does not require classpath scanning or annotation reflection.
          required: true
        - label: I understand that 1.x does not guarantee binary compatibility across releases.
          required: true
